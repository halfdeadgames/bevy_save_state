# Shared build folder for every Bevy 0.20 project, so Bevy is compiled once and
# reused by all projects and git worktrees. Only one build can run in it at a time
# (cargo waits on its lock). Trim it by hand from any project that uses it:
# cargo sweep --time 14 (add --dry-run first to see what goes).
[build]
target-dir = "C:/Users/halfdeadgamrs/Documents/BevyProjects/.target/bevy-0.20"

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
